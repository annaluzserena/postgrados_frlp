# docker-compose.yml — Ambiente de desarrollo Fenix Posgrado
# Preparar la base: docker compose up -d db
# Construir las imágenes: docker compose build backend frontend
# Aplicar migraciones: docker compose run --rm backend alembic upgrade head
# Iniciar la aplicación: docker compose up -d backend frontend
# Detener: docker compose down

services:
  # ──────────────────────────────────────────
  # BASE DE DATOS PostgreSQL
  # ──────────────────────────────────────────
  # Crea la base DB_NAME (fenix_postgrado) solo la primera vez (si el volumen está vacío).
  # El esquema postgrados y las tablas los crea Alembic, no Docker.
  db:
    image: postgres:16-alpine
    container_name: postgrado-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgrado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrado_dev_password}
      POSTGRES_DB: ${DB_NAME:-fenix_postgrado}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgrado_user} -d ${DB_NAME:-fenix_postgrado}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # BACKEND API
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: postgrado-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgrado_user}:${DB_PASSWORD:-postgrado_dev_password}@db:5432/${DB_NAME:-fenix_postgrado}
      DB_SCHEMA: ${DB_SCHEMA:-postgrados}
      JWT_SECRET: ${JWT_SECRET:?Defini JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      STORAGE_PATH: /var/postgrado-storage
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      NODE_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - postgrado-storage:/var/postgrado-storage

  # ──────────────────────────────────────────
  # FRONTEND
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: postgrado-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_MOCKS: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

  # ──────────────────────────────────────────
  # MAILHOG — Servidor de email falso para desarrollo
  # Ver emails en: http://localhost:8025
  # ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: postgrado-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI web para ver emails

volumes:
  pgdata:
    name: postgrado-pgdata
  postgrado-storage:
    name: postgrado-storage
